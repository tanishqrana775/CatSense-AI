{% extends "base.html" %}

{% block body %}
<nav class="navbar">
    <div class="container">
        <a href="{{ url_for('home') }}" class="nav-logo">
            <div class="logo-icon">🐱</div>
            <span>CatSense AI</span>
        </a>
        
        <div class="nav-links">
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('new_analysis') }}">New Analysis</a>
                <a href="{{ url_for('history') }}">History</a>
                <a href="{{ url_for('metrics') }}">Metrics</a>
                <a href="{{ url_for('profile') }}">Profile</a>
                <a href="{{ url_for('logout') }}" class="btn btn-ghost btn-sm">Logout</a>
            {% else %}
                <a href="{{ url_for('landing') }}">Home</a>
                <a href="{{ url_for('demo') }}">Try Demo</a>
                <a href="{{ url_for('login') }}">Login</a>
                <a href="{{ url_for('register') }}" class="btn btn-primary btn-sm">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>

<div style="padding-top: 60px;">
    {% block content %}{% endblock %}
</div>
{% endblock %}
