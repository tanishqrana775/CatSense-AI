<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}CatSense AI - Feline Emotion Recognition using multimodal facial and acoustic neural networks{% endblock %}">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}CatSense AI | Feline Emotion Recognition{% endblock %}</title>

    <!-- Theme Initialization (Prevents flash of incorrect theme) -->
    <script>
      (function() {
        {% if lock_dark %}
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-lock-dark', 'true');
        {% else %}
          try {
            var saved = localStorage.getItem('catsense_theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
          } catch (e) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        {% endif %}
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">

    <!-- Fonts: Inter Only (Weights 400-800) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Design System Stylesheets -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/components.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body data-page="{% block page_id %}default{% endblock %}">

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    {% block body %}
    <!-- Page content -->
    {% endblock %}

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='scripts/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='scripts/main.js') }}"></script>

    <!-- Flash Messages Handler -->
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        function showNotification(msg, cat) {
          const container = document.getElementById('toastContainer');
          if (!container) return;
          const toast = document.createElement('div');
          toast.className = 'toast toast-' + (cat === 'danger' ? 'danger' : cat === 'success' ? 'success' : cat === 'warning' ? 'warning' : 'info');
          
          let icon = 'ℹ️';
          if (cat === 'success') icon = '✅';
          else if (cat === 'danger') icon = '❌';
          else if (cat === 'warning') icon = '⚠️';

          toast.innerHTML = '<span style="font-size:1.1rem">' + icon + '</span><span>' + msg + '</span>';
          container.appendChild(toast);
          setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-10px)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
          }, 4500);
        }

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              showNotification({{ message|tojson }}, {{ category|tojson }});
            {% endfor %}
          {% endif %}
        {% endwith %}
      });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
